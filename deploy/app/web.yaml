apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: web
          ports: [{ containerPort: 3000 }]
          env:
            - { name: API_URL, value: "http://api:8080" }
            # In-cluster sandboxes serve plain HTTP, so the browser would drop a Secure cookie (SEC-9).
            - { name: COOKIE_SECURE, value: "false" }
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ port: 3000, targetPort: 3000 }]
