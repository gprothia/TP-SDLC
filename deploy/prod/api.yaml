# Production API for canary releases (standards/release.md REL-3), rendered by scripts/prod.sh:
# NS, IMAGE (api image without tag), STABLE_TAG.
#
#   api-stable  9 copies of the current release
#   api-canary  0 copies normally; 1 copy of the new release during a canary
#
# The Service selects both, so with 9 + 1 copies the canary gets about 10% of traffic.
# Every response carries X-App-Track (stable|canary) so each can be measured on its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-stable
  namespace: ${NS}
  labels: { app: api, track: stable }
spec:
  replicas: 9
  selector: { matchLabels: { app: api, track: stable } }
  template:
    metadata: { labels: { app: api, track: stable } }
    spec:
      containers:
        - name: api
          image: ${IMAGE}:${STABLE_TAG}
          ports: [{ containerPort: 8080 }]
          env:
            - { name: APP_TRACK, value: stable }
            - { name: APP_VERSION, value: "${STABLE_TAG}" }
            - { name: SEED_TEST_DATA, value: "true" }       # demo data (in-memory, per copy)
            - { name: ENABLE_TEST_HOOKS, value: "false" }   # never in production
            - { name: PARTNER_LATENCY_MS, value: "600" }    # the real partner's round trip
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-canary
  namespace: ${NS}
  labels: { app: api, track: canary }
spec:
  replicas: 0
  selector: { matchLabels: { app: api, track: canary } }
  template:
    metadata: { labels: { app: api, track: canary } }
    spec:
      containers:
        - name: api
          image: ${IMAGE}:${STABLE_TAG}
          ports: [{ containerPort: 8080 }]
          env:
            - { name: APP_TRACK, value: canary }
            - { name: APP_VERSION, value: "${STABLE_TAG}" }
            - { name: SEED_TEST_DATA, value: "true" }
            - { name: ENABLE_TEST_HOOKS, value: "false" }
            - { name: PARTNER_LATENCY_MS, value: "600" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ${NS}
spec:
  selector: { app: api }
  ports: [{ port: 8080, targetPort: 8080 }]
